site_name: Kramerius – dokumentace
site_description: Produktová a technická dokumentace systému Kramerius
site_url: https://ceskaexpedice.github.io/misc/
repo_url: https://github.com/ceskaexpedice/misc
repo_name: ceskaexpedice/misc

theme:
  name: material
  language: cs
  icon:
    logo: material/library-shelves
    repo: fontawesome/brands/github
  font:
    text: Roboto
    code: Red Hat Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Přepnout na tmavý režim
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: light-blue
      toggle:
        icon: material/brightness-4
        name: Přepnout na světlý režim
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.path
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - Úvod:
      - Přehled: index.md
      - Kurátor: getting-started/curator.md
      - Administrátor: getting-started/admin.md
      - Vývojář: getting-started/developer.md
  - Doménové pojmy: domain-concepts/index.md
  - Návody:
      - Přehled: guides/index.md
      - Kurátor: guides/curator/index.md
      - Administrátor: guides/admin/index.md
      - Vývojář: guides/developer/index.md
  - Technické koncepty:
      - Přehled: core-concepts/index.md
      - Kramerius Core: core-concepts/core/index.md
      - Akubra: core-concepts/akubra/index.md
      - Vyhledávání: core-concepts/search/index.md
      - Zabezpečení: core-concepts/security/index.md
      - Procesy: core-concepts/process-platform/index.md
      - ČDK: core-concepts/cdk/index.md
      - API: core-concepts/api/index.md
  - Architektura:
      - Přehled: architecture/index.md
      - Kramerius Core: architecture/core/index.md
      - Vyhledávání: architecture/search/index.md
      - Zabezpečení: architecture/security/index.md
      - Procesy: architecture/process-platform/index.md
      - ČDK: architecture/cdk/index.md
  - Konfigurace:
      - Přehled: configuration/index.md
      - Kramerius Core: configuration/core/index.md
      - Akubra: configuration/akubra/index.md
      - Vyhledávání: configuration/search/index.md
      - Zabezpečení: configuration/security/index.md
      - Procesy: configuration/process-platform/index.md
      - Zámky: configuration/distributed-locks/index.md
      - Image server: configuration/iiif/index.md
  - Nasazení:
      - Přehled: deployment/index.md
      - Docker: deployment/docker/index.md
      - Kubernetes: deployment/kubernetes/index.md
      - On Premise: deployment/on-premise/index.md
  - Reference:
      - Přehled: reference/index.md
      - API: reference/api/index.md
      - Core: reference/core/index.md
      - Akubra: reference/akubra/index.md
      - Vyhledávání: reference/search/index.md
      - Zabezpečení: reference/security/index.md
      - Procesy: reference/process-platform/index.md
      - Zámky: reference/distributed-locks/index.md
      - Image server: reference/image-server/index.md
      - Statistiky: reference/statistics/index.md
      - ČDK: reference/cdk/index.md
      - Web klient: reference/client/index.md
      - Admin klient: reference/client-admin/index.md
  - Verzování: versioning/index.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ceskaexpedice/misc
      name: Projekt na GitHubu

copyright: Copyright &copy; 2026 Česká digitální knihovna

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
